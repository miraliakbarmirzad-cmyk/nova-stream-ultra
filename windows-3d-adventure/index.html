<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA: Lost Frontier — Browser Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#050812;color:#eafaff;font:14px system-ui,sans-serif}
#hud{position:fixed;top:16px;left:16px;z-index:3;padding:14px 16px;background:#071320d9;border:1px solid #36d9ff70;border-radius:12px;line-height:1.8;box-shadow:0 0 24px #00bde522}
#title{font-weight:900;letter-spacing:2px;color:#55eaff;font-size:18px}#help{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:3;background:#071320d9;border:1px solid #36d9ff60;border-radius:10px;padding:10px 14px;text-align:center;white-space:nowrap}
#overlay{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#020610b9;text-align:center;padding:20px}
.panel{max-width:560px;padding:30px;border:1px solid #46dfff77;border-radius:18px;background:linear-gradient(145deg,#101c32f5,#07101df5);box-shadow:0 0 70px #008dff30}
h1{margin:0 0 8px;font-size:clamp(30px,6vw,54px);color:#5cecff;letter-spacing:2px}button{border:0;border-radius:999px;padding:13px 24px;background:linear-gradient(90deg,#9e44ff,#ff587d);color:white;font-weight:800;font-size:16px;cursor:pointer}
#status{color:#a8c7d9}
</style>
</head><body>
<div id="hud"><div id="title">NOVA: LOST FRONTIER</div><div id="stats">HEALTH 100 · CRYSTALS 0/3 · SENTINELS 3</div><div id="status">Find the energy crystals.</div></div>
<div id="help">WASD move · Mouse aim · Click fire · Space jump · Esc unlock mouse</div>
<div id="overlay"><div class="panel"><h1>NOVA</h1><p>LOST FRONTIER · 3D BROWSER DEMO</p><p>Recover three glowing crystals while avoiding hostile sentinels.</p><p id="small">Best on desktop with keyboard and mouse.</p><button id="start">ENTER THE FRONTIER</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07101c);scene.fog=new THREE.Fog(0x07101c,24,65);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,120);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9acfff,0x17202b,2));const sun=new THREE.DirectionalLight(0x9fe7ff,2.3);sun.position.set(-8,18,8);sun.castShadow=true;scene.add(sun);
const mat=(color,emissive=null)=>new THREE.MeshStandardMaterial({color,roughness:.8,...(emissive?{emissive,emissiveIntensity:1.5}:{})});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(44,70),mat(0x26343a));ground.rotation.x=-Math.PI/2;ground.position.set(0,-.08,-13);ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(44,22,0x1b8195,0x29424b);grid.position.set(0,-.04,-13);scene.add(grid);
function box(x,y,z,sx,sy,sz,color){let m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(color));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
for(const x of [-21,21])box(x,2,-13,1,4,70,0x173c49);
for(let z=-36;z<6;z+=8)for(const x of [-15,-10,10,15])if(Math.random()>.25)box(x,1,z,1.5,2,1.5,0x52616a);
for(let i=0;i<34;i++){const r=.15+Math.random()*.35;const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(r),mat(0x3a4a50));rock.position.set((Math.random()-.5)*38,.05,Math.random()*-48+5);scene.add(rock)}
const player=new THREE.Group();scene.add(player);player.position.set(0,0,4);
const suit=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.85,4,8),mat(0x1689bd));suit.position.y=1;player.add(suit);
const visor=new THREE.Mesh(new THREE.SphereGeometry(.25,12,10),mat(0x75f4ff,0x0088aa));visor.position.set(0,1.55,-.18);player.add(visor);
const gun=box(0,0,0,.16,.15,.6,0x9acbd5);gun.parent=player;gun.position.set(.36,1.05,-.5);
const cameraPivot=new THREE.Object3D();cameraPivot.position.set(0,1.55,0);player.add(cameraPivot);camera.position.set(0,.6,4.7);cameraPivot.add(camera);
let yaw=0,pitch=-.08,health=100,crystals=0,gameover=false,started=false,velocityY=0,onGround=true;const keys={};const crystalObjects=[],enemies=[];
function crystal(x,z){const mesh=new THREE.Mesh(new THREE.OctahedronGeometry(.58),mat(0x28f4ff,0x00bddd));mesh.position.set(x,.95,z);scene.add(mesh);const light=new THREE.PointLight(0x00cfff,2,5);light.position.copy(mesh.position);scene.add(light);crystalObjects.push({mesh,light,baseY:.95})}
crystal(7,-8);crystal(-8,-17);crystal(3,-28);
function enemy(x,z){const g=new THREE.Group();g.position.set(x,0,z);const body=new THREE.Mesh(new THREE.BoxGeometry(.95,1.55,.75),mat(0xc33148,0x42000a));body.position.y=.9;g.add(body);const eye=new THREE.Mesh(new THREE.BoxGeometry(.45,.12,.08),mat(0xff553e,0xff1c00));eye.position.set(0,1.2,-.4);g.add(eye);scene.add(g);enemies.push({g,hp:3,t:0})}
enemy(0,-12);enemy(9,-21);enemy(-8,-27);
function updateHUD(){document.getElementById('stats').textContent=`HEALTH ${health} · CRYSTALS ${crystals}/3 · SENTINELS ${enemies.length}`}
function end(title,sub){gameover=true;document.exitPointerLock?.();document.getElementById('overlay').style.display='grid';document.querySelector('.panel').innerHTML=`<h1>${title}</h1><p>${sub}</p><button id="start">PLAY AGAIN</button>`;document.getElementById('start').onclick=()=>location.reload()}
document.getElementById('start').onclick=()=>{started=true;document.getElementById('overlay').style.display='none';renderer.domElement.requestPointerLock()};
document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement!==renderer.domElement&&started&&!gameover)document.getElementById('status').textContent='Click the game to recapture mouse.'});
document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0025;pitch=Math.max(-.7,Math.min(.35,pitch-e.movementY*.002));player.rotation.y=yaw;camera.rotation.x=pitch}});
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault()});document.addEventListener('keyup',e=>keys[e.code]=false);
document.addEventListener('mousedown',e=>{if(!started||gameover)return;if(document.pointerLockElement!==renderer.domElement){renderer.domElement.requestPointerLock();return}if(e.button!==0)return;const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion())).normalize();const ray=new THREE.Raycaster(camera.getWorldPosition(new THREE.Vector3()),dir,0,55);const targets=enemies.flatMap(e=>e.g.children);const hits=ray.intersectObjects(targets);if(hits.length){const en=enemies.find(e=>e.g===hits[0].object.parent);if(en){en.hp--;if(en.hp<=0){scene.remove(en.g);enemies.splice(enemies.indexOf(en),1);updateHUD()}}}});
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04);if(started&&!gameover){const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));const move=new THREE.Vector3();if(keys.KeyW||keys.ArrowUp)move.add(forward);if(keys.KeyS||keys.ArrowDown)move.sub(forward);if(keys.KeyD||keys.ArrowRight)move.add(right);if(keys.KeyA||keys.ArrowLeft)move.sub(right);if(move.lengthSq())move.normalize().multiplyScalar(7*dt);player.position.add(move);player.position.x=THREE.MathUtils.clamp(player.position.x,-19,19);player.position.z=THREE.MathUtils.clamp(player.position.z,-39,7);if(keys.Space&&onGround){velocityY=6;onGround=false}velocityY-=18*dt;player.position.y+=velocityY*dt;if(player.position.y<=0){player.position.y=0;velocityY=0;onGround=true}
for(const c of [...crystalObjects]){c.mesh.rotation.y+=dt*1.3;c.mesh.position.y=c.baseY+Math.sin(performance.now()*.002+c.mesh.position.x)*.14;if(player.position.distanceTo(c.mesh.position)<1.5){scene.remove(c.mesh,c.light);crystalObjects.splice(crystalObjects.indexOf(c),1);crystals++;updateHUD();document.getElementById('status').textContent='Energy crystal recovered!';if(crystals===3)end('MISSION COMPLETE','All three energy crystals recovered. Great work, explorer!')}}
for(const e of enemies){const d=player.position.clone().sub(e.g.position);d.y=0;if(d.length()>1.55){d.normalize();e.g.position.addScaledVector(d,2*dt);e.g.lookAt(player.position.x,.9,player.position.z)}else{e.t-=dt;if(e.t<=0){e.t=1.15;health=Math.max(0,health-10);updateHUD();if(!health)end('MISSION FAILED','The sentinels overwhelmed you. Try another route.')}}}
}renderer.render(scene,camera)}loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
