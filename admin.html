<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل خصوصی NOVA STREAM ULTRA</title><style>body{background:#0b0b17;color:#fff;font-family:Tahoma,Arial;max-width:640px;margin:30px auto;padding:20px}section{background:#1b1b30;padding:22px;border-radius:18px;margin:15px 0}input,textarea,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:8px;border:1px solid #444;background:#101023;color:white}button{background:#6d3ae3;cursor:pointer;border:0}button:disabled{opacity:.5}label{display:block;margin-top:12px}small{color:#b9b9cc}#editor{display:none}a{color:#cbb9ff}</style></head><body><h1>🎬 پنل آپلود NOVA STREAM ULTRA</h1><p>فقط مدیر مجاز می‌تواند فلم اضافه کند. تنها ویدیوهایی را آپلود کن که اجازهٔ نشرشان را داری.</p><section id="login"><h2>ورود مدیر</h2><input id="email" type="email" placeholder="ایمیل حساب مدیر"><input id="password" type="password" placeholder="رمز عبور"><button id="signin">ورود</button><p id="loginMessage"></p></section><section id="editor"><h2>آپلود فلم</h2><small id="identity"></small><label>نام فلم<input id="title" required></label><label>سال<input id="year" type="number" min="1880" max="2100"></label><label>کشور<input id="country"></label><label>ژانر<input id="genre"></label><label>توضیحات<textarea id="description"></textarea></label><label>پوستر (JPG/PNG/WebP)<input id="poster" type="file" accept="image/jpeg,image/png,image/webp"></label><label>ویدیو (MP4/WebM، حداکثر ۵۰ مگابایت)<input id="video" type="file" accept="video/mp4,video/webm"></label><button id="upload">آپلود و انتشار فلم</button><button id="signout">خروج</button><p id="status"></p></section><p><a href="./">بازگشت به سایت</a></p><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient("https://yrgcoqohgpjnpbmiqqlf.supabase.co","sb_publishable_aaxKC_6q3YZ2ZUwouii9sA_FPdqGW6n");
const el=id=>document.getElementById(id),msg=(id,s)=>el(id).textContent=s;
async function refresh(){const {data:{user}}=await sb.auth.getUser();if(!user){el("login").style.display="block";el("editor").style.display="none";return}const {data:admin}=await sb.from("site_admins").select("user_id").eq("user_id",user.id).maybeSingle();el("login").style.display="none";el("editor").style.display=admin?"block":"none";if(admin)msg("identity","مدیر: "+user.email);else{el("login").style.display="block";msg("loginMessage","حساب ساخته شد اما هنوز اجازهٔ مدیریت ندارد. شناسهٔ حساب خود را برای فعال‌سازی مدیر بفرست: "+user.id)}}
el("signin").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:el("email").value,password:el("password").value});msg("loginMessage",error?error.message:"ورود انجام شد.");await refresh()};
el("signout").onclick=async()=>{await sb.auth.signOut();await refresh()};
el("upload").onclick=async()=>{const title=el("title").value.trim(),video=el("video").files[0],poster=el("poster").files[0];if(!title||!video||!poster){msg("status","نام، پوستر و ویدیو ضروری است.");return}if(video.size>50*1024*1024||poster.size>10*1024*1024){msg("status","حجم فایل از محدودیت بیشتر است.");return}el("upload").disabled=true;msg("status","در حال آپلود...");try{const id=crypto.randomUUID(),vp=id+"."+video.name.split(".").pop().toLowerCase(),pp=id+"."+poster.name.split(".").pop().toLowerCase();let r=await sb.storage.from("film-videos").upload(vp,video,{upsert:false,contentType:video.type});if(r.error)throw r.error;r=await sb.storage.from("film-posters").upload(pp,poster,{upsert:false,contentType:poster.type});if(r.error)throw r.error;r=await sb.from("films").insert({title,release_year:Number(el("year").value)||null,country:el("country").value,genre:el("genre").value,description:el("description").value,video_path:vp,poster_path:pp});if(r.error)throw r.error;msg("status","فلم با موفقیت منتشر شد.");}catch(e){msg("status","خطا: "+e.message)}finally{el("upload").disabled=false}};
refresh();
</script></body></html>
